  button:disabled { opacity: .5; }
  button + button { margin-top: 8px; }
  .prize { display: flex; align-items: center; gap: 12px; }
  .prize .ic { font-size: 28px; }
  .prize .body { flex: 1; min-width: 0; }
  .prize .title { font-weight: 600; }
  .prize button { width: auto; padding: 9px 14px; white-space: nowrap; }
  .phone { display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 4px 12px; margin: 10px 0;

  button.link { background: none; color: var(--link); font-weight: 500; padding: 12px 4px; white-space: pre-line; line-height: 1.5; }
  textarea { width: 100%; min-height: 110px; border-radius: 12px; padding: 10px 12px; font: inherit;

  .seg { display: flex; gap: 6px; }
  .seg button { padding: 8px 10px; font-weight: 500; }

  .link { word-break: break-all; color: var(--link); font-size: 14px; margin: 8px 0 12px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card);

    r_tenure: "staj",
    commission: "komissiya chegirmasi", c_days: "{n} kun", c_pct: "komissiya {p}%",
    when: "Qaysi kundan yoqilsin?", when_today: "Bugun", when_tomorrow: "Ertaga", cancel: "Bekor qilish",
    redeem_promo_ok: "✅ Tayyor! {start} dan {end} gacha komissiya {pct}%. Operator uni Dispetcherlikda yoqadi.",
    active_title: "Hozir amal qilmoqda", active_row: "{title}: {start} dan {end} gacha",

    e_bad_start: "18:00 dan keyin chegirmani faqat ertadan yoqish mumkin.",
    promo_offer: "🚖 Qayting! {days} kun park komissiyasisiz (0%) ishlash. Liniyaga chiqishga tayyor bo'lganingizda faollashtiring — taklif {until} gacha amal qiladi.",
    promo_btn: "{days} kun komissiyasiz — faollashtirish",
    promo_confirm: "{days} kun komissiyasiz ishlash faollashtirilsinmi? Bugundan boshlanadi (18:00 dan keyin bo'lsa — ertadan).",
    promo_active: "✅ {start} dan {end} gacha park komissiyasisiz. Operator Dispetcherlikda 0% ni yoqadi. Agar buyurtmalar hali komissiya bilan kelayotgan bo'lsa — qo'llab-quvvatlashga yozing.",
    promo_done: "✅ Faollashtirildi! Operator tez orada 0% ni yoqadi.",
    e_promo_unavailable: "Taklif endi faol emas.",
    tenure: "Parkdagi staj", tenure_months: "{n} oy",
    tenure_rule: "Oy {min} va undan ortiq ish kuni bo'lsa hisoblanadi.",
    tenure_cur: "Shu oyda: {min} kundan {d} kun",
    tenure_next: "{m} oylik staj uchun: +{pts} ball",
    retry: "Qayta urinish", only_tg: "Bu sahifani @zerotaxi_bot dagi «Bonuslar» tugmasi orqali oching.",
  },
};

const tg = window.Telegram && window.Telegram.WebApp;
let lang = "ru", data = null, tab = "home", busy = false;

function t(key, kw) {
  // Пустая строка — тоже значение (например, единица «заказы» без подписи), не подменяем её ключом.
  let s = T[lang] && key in T[lang] ? T[lang][key] : key in T.ru ? T.ru[key] : key;
  if (kw) for (const k in kw) s = s.split("{" + k + "}").join(kw[k] == null ? "" : String(kw[k]));   // пусто, а не "undefined"
  return s;
}
function fmt(n) { return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function ddmm(ymd) { return ymd && ymd.length >= 10 ? ymd.slice(8, 10) + "." + ymd.slice(5, 7) : (ymd || ""); }

/** Элемент: h("div.card", {onclick}, child, "text", ...) — текст всегда через textContent. */
function h(tag, attrs, ...kids) {
  const [name, ...cls] = tag.split(".");
  const el = document.createElement(name || "div");
  if (cls.length) el.className = cls.join(" ");
  // Атрибуты — только обычный объект {…}; всё остальное (текст, число, 0, элемент, список) — содержимое.
  if (attrs !== undefined && (attrs === null || typeof attrs !== "object" || attrs instanceof Node || Array.isArray(attrs))) {
    kids.unshift(attrs); attrs = null;
  }
  for (const k in attrs || {}) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), attrs[k]);
    else if (k === "style") el.style.cssText = attrs[k];
    else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}

async function call(a, extra) {
  let res;
  try {
    res = await fetch(API, { method: "POST", body: JSON.stringify(Object.assign({ a, init: tg.initData }, extra || {})) });
  } catch (e) { return { ok: false, error: "net" }; }
  try { return await res.json(); } catch (e) { return { ok: false, error: "server" }; }
}

function errText(code) { return T.ru["e_" + code] ? t("e_" + code) : t("e_server"); }

/** Ответ с ошибкой: если профиль успели отвязать — назад на экран привязки. → true, если обработано */
function lostProfile(r) {
  if (r && r.error === "not_registered") { start(); return true; }
  return false;
}
function alertMsg(text) { return new Promise(r => tg.showAlert ? tg.showAlert(text, r) : (alert(text), r())); }
function confirmMsg(text) { return new Promise(r => tg.showConfirm ? tg.showConfirm(text, r) : r(confirm(text))); }
function haptic(kind) { try { tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} }

const app = document.getElementById("app");
const tabsEl = document.getElementById("tabs");

function screen(...kids) {
  app.replaceChildren(...kids.flat().filter(k => k != null && k !== false));   // пустые блоки не выводим
  window.scrollTo(0, 0);
}
function loading() { screen(h("div.spin")); }

function fatal(code) {
  tabsEl.hidden = true;
  screen(h("div.hero", h("div.e", "⚠️"), h("p", errText(code))),
         code === "auth" || code === "auth_expired" ? null : h("button", { onclick: start }, t("retry")));
}

// Прошлые данные из памяти телефона: показываем сразу, свежие подгружаем в фоне.
function cacheKey() { try { return "zb:" + tg.initDataUnsafe.user.id; } catch (e) { return "zb"; } }
function cacheGet() { try { return JSON.parse(localStorage.getItem(cacheKey()) || "null"); } catch (e) { return null; } }
function cacheSet(r) { try { localStorage.setItem(cacheKey(), JSON.stringify(r)); } catch (e) {} }

async function start() {
  if (!tg || !tg.initData) { screen(h("div.hero", h("div.e", "🎁"), h("p", T.ru.only_tg), h("p", T.uz.only_tg))); return; }
  const cached = cacheGet();
  if (cached && cached.registered) apply(cached); else loading();
  const r = await call("load");
  if (!r.ok) { if (!cached || !cached.registered) fatal(r.error); return; }
  if (busy) return;                       // пока грузилось, водитель уже что-то нажал
  apply(r);
}

function apply(r) {
  data = r;
  if (r.ok) cacheSet(r);
  if (!r.registered) { lang = r.lang || lang; return renderRegister(); }
  lang = r.me.lang;
  document.documentElement.lang = lang;
  render();
}

// ---------------- Привязка ----------------

let regMode = "tg";                       // "tg" — кнопка Telegram, "manual" — ввод номера Yandex Pro

function renderRegister(msg) {
  tabsEl.hidden = true;
  const seg = h("div.seg",
    h("button" + (lang === "ru" ? "" : ".off"), { onclick: () => { lang = "ru"; renderRegister(msg); } }, "🇷🇺 Русский"),
    h("button" + (lang === "uz" ? "" : ".off"), { onclick: () => { lang = "uz"; renderRegister(msg); } }, "🇺🇿 O'zbekcha"));
  const head = [h("div.hero", h("div.e", "🎁"), h("h1", t("reg_title"))), h("div.card", seg)];
  if (regMode === "manual") {
    const input = h("input", { type: "tel", inputmode: "numeric", autocomplete: "tel", placeholder: "90 123 45 67", maxlength: "16" });
    const go = () => registerManual(input.value);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    screen(...head,
      h("div.card", h("b", t("manual_title")), h("div.muted", { style: "margin-top:4px" }, t("manual_hint")),
        h("div.phone", h("b", "+998"), input)),
      msg ? h("div.note.warn", msg) : null,
      h("div", { style: "margin-top:14px" }, h("button", { onclick: go }, t("manual_btn"))),
      h("button.link", { onclick: () => { regMode = "tg"; renderRegister(); } }, t("back_tg")));
    setTimeout(() => input.focus(), 50);
    return;
  }
  screen(...head,
    h("div.card", { style: "white-space:pre-line" }, t("reg_text")),
    msg ? h("div.note.warn", msg) : null,
    h("div", { style: "margin-top:14px" }, h("button", { onclick: register }, t("reg_btn"))),
    h("button.link", { onclick: () => { regMode = "manual"; renderRegister(); } }, t("manual_link")));
}

// Разрешение боту писать водителю: нужно, если он пришёл по ссылке и ни разу не нажимал Start
// (иначе не придут закреплённая кнопка «Бонусы» и утренние сообщения). Отказ не мешает привязке.
function withWriteAccess(next) {
  if (tg.requestWriteAccess && tg.isVersionAtLeast("6.9")) tg.requestWriteAccess(() => next()); else next();
}

function register() {
  if (busy) return;
  if (!tg.requestContact || !tg.isVersionAtLeast("6.9")) { regMode = "manual"; return renderRegister(); }
  withWriteAccess(askContact);
}

function askContact() {
  tg.requestContact(async (shared, resp) => {
    if (!shared || !resp || !resp.response) return renderRegister(t("reg_cancel"));
    busy = true;
    screen(h("div.spin"), h("p.center.muted", t("reg_wait")));
    const r = await call("register", { contact: resp.response, lang });
    busy = false;
    if (!r.ok && r.error === "not_found") {      // Telegram на другом номере — ввод номера Yandex Pro
      haptic("warning"); regMode = "manual"; return renderRegister(t("not_found_tg"));
    }
    finishRegister(r);
  });
}

function registerManual(raw) {
  if (busy) return;
  let d = String(raw || "").replace(/\D/g, "");
  if (d.length === 12 && d.startsWith("998")) d = d.slice(3);
  if (d.length !== 9) { haptic("error"); return renderRegister(t("e_bad_phone")); }
  withWriteAccess(async () => {
    busy = true;
    screen(h("div.spin"), h("p.center.muted", t("reg_wait")));
    const r = await call("register_manual", { phone: "998" + d, lang });
    busy = false;
    finishRegister(r);
  });
}

function finishRegister(r) {
  if (!r.ok) { haptic("error"); return renderRegister(errText(r.error)); }
  haptic("success");
  regMode = "tg";
  apply(r);
  if (r.registered) alertMsg(t("welcome", { name: r.me.name }));
}

// ---------------- Основной экран ----------------

const TABS = [["home", "⭐"], ["shop", "🎁"], ["tasks", "🎯"], ["friends", "🤝"], ["more", "⚙️"]];

function render() {
  tabsEl.hidden = false;
  tabsEl.replaceChildren(...TABS.map(([k, e]) =>
    h("button" + (tab === k ? ".on" : ""), { onclick: () => { tab = k; render(); } }, h("span.e", e), t("tab_" + k))));
  const views = { home: viewHome, shop: viewShop, tasks: viewTasks, friends: viewFriends, more: viewMore };
  screen(...views[tab]());
}

function viewHome() {
  const L = data.level, R = data.rate;
  const levelCard = h("div.card",
    h("div.row", h("div", h("span.muted", t("level") + " "), h("span.badge", L.name)), h("span.muted", t("mult", { m: L.mult }))),
    h("div.bar", h("i", { style: "width:" + L.pct + "%" })),
    h("div.muted", t("orders_in", { d: L.days, n: L.orders })),
    h("div.muted", L.next_name ? t("to_next", { next: L.next_name, need: L.need }) : t("max_level")));
  const rateText = t("rate_" + R.kind, R);
  const out = [];
  const P = data.promo;
  if (P && P.status === "offer") {
    out.push(h("div.card", { style: "border:2px solid var(--accent)" },
      h("div", { style: "margin-bottom:10px" }, t("promo_offer", P)),
      h("button", { onclick: () => activatePromo(P) }, t("promo_btn", P))));
  } else if (P && P.status === "active") {
    out.push(h("div.card", { style: "border:2px solid var(--ok)" }, t("promo_active", P)));
  }
  const AP = data.active_promos || [];
  if (AP.length) {
    out.push(h("div.card", { style: "border:2px solid var(--ok)" },
      h("b", "🏷 " + t("active_title")),
      AP.map(x => h("div", { style: "margin-top:6px" }, t("active_row", x)))));
  }
  out.push(
    h("div.card.balance", h("div.num", fmt(data.balance)), h("div.lbl", t("balance"))),
    levelCard);
  const TN = data.tenure;
  if (TN) {
    out.push(h("div.card",
      h("div.row", h("span.muted", t("tenure")), h("b", t("tenure_months", { n: TN.months }))),
      h("div.bar", h("i", { style: "width:" + Math.min(100, Math.round(TN.cur_days / TN.min_days * 100)) + "%" })),
      h("div.muted", t("tenure_cur", { d: TN.cur_days, min: TN.min_days })),
      TN.next_m ? h("div.muted", t("tenure_next", { m: TN.next_m, pts: fmt(TN.next_pts) })) : null,
      h("div.muted", { style: "font-size:12px;margin-top:4px" }, t("tenure_rule", { min: TN.min_days }))));
  }
  out.push(
    h("div.note" + (R.kind === "low" ? ".warn" : ""), rateText));
  if (data.low_offer) {
    out.push(h("div.note.warn", data.low_offer));
    out.push(h("div", { style: "margin-top:10px" }, h("button", { onclick: switchReq }, t("want_switch", { p: R.min_pct }))));
  }
  if (data.rule) out.push(h("div.muted", { style: "margin:10px 4px 0" }, "ℹ️ " + data.rule));
  out.push(h("h2", t("history")));
  out.push(h("div.card", data.history.length
    ? h("div.list", data.history.map(x => h("div",
        h("span", h("span.muted", ddmm(x.d) + "  "), T.ru["r_" + x.reason] ? t("r_" + x.reason) : x.reason),
        h("span." + (x.pts >= 0 ? "plus" : "minus"), (x.pts > 0 ? "+" : "") + fmt(x.pts)))))
    : h("div.muted", t("history_empty"))));
  return out;
}

async function activatePromo(P) {
  if (busy || !(await confirmMsg(t("promo_confirm", P)))) return;
  busy = true;
  loading();
  const r = await call("promo");
  busy = false;
  if (!r.ok && lostProfile(r)) return;
  if (!r.ok) { haptic("error"); await alertMsg(errText(r.error)); return render(); }
  haptic("success");
  apply(r);
  alertMsg(t("promo_done"));
}

async function switchReq() {
  if (busy) return;
  busy = true;
  const r = await call("switch");
  busy = false;
  if (!r.ok && lostProfile(r)) return;
  if (!r.ok) return alertMsg(errText(r.error));
  haptic("success");
  alertMsg(t("switch_sent"));
}

function viewShop() {
  const out = [h("div.card.balance", h("div.num", fmt(data.balance)), h("div.lbl", t("balance")))];
  out.push(h("h2", t("shop_title")));
  if (!data.shop.length) out.push(h("div.card.muted", t("shop_empty")));
  for (const p of data.shop) {
    const can = data.balance >= p.price;
    out.push(h("div.card.prize",
      h("div.ic", p.type === "money" ? "💵" : p.type === "commission" ? "🏷" : "📦"),
      h("div.body", h("div.title", p.title),
        h("div.muted", fmt(p.price) + " " + t("pts") + " · " +
          (p.type === "commission" ? t("c_days", { n: p.days || 1 }) + ", " + t("c_pct", { p: String(p.pct || 0).replace(".", ",") })
            : t(p.type === "money" ? "money" : "merch")) +
          (p.left != null ? " · " + t("left", { n: p.left }) : ""))),
      can ? h("button", { onclick: () => redeem(p) }, t("get"))
          : h("span.muted", t("need_more", { n: fmt(p.price - data.balance) }))));
  }
  out.push(h("div.muted.center", { style: "margin-top:8px" }, t("shop_limit", { n: data.redeem_max_per_day })));
  return out;
}

function askStart() {
  const buttons = [];
  if (!data.late) buttons.push({ id: "today", type: "default", text: t("when_today") });
  buttons.push({ id: "tomorrow", type: "default", text: t("when_tomorrow") });
  buttons.push({ id: "", type: "cancel" });
  return new Promise(r => tg.showPopup ? tg.showPopup({ message: t("when"), buttons }, id => r(id || null))
                                       : r(confirm(t("when")) ? "tomorrow" : null));
}

async function redeem(p) {
  if (busy) return;
  if (!(await confirmMsg(t("redeem_confirm", { price: fmt(p.price), title: p.title })))) return;
  let start = "";
  if (p.type === "commission") { start = await askStart(); if (!start) return; }
  busy = true;
  loading();
  const r = await call("redeem", { reward_id: p.id, start });
  busy = false;
  if (!r.ok && lostProfile(r)) return;
  if (!r.ok) { haptic("error"); await alertMsg(errText(r.error)); }
  else {
    haptic("success");
    await alertMsg(r.promo ? t("redeem_promo_ok", r.promo) : t("redeem_ok", { rid: r.rid, price: fmt(r.price) }));
  }
  const fresh = await call("load");
  if (fresh.ok) apply(fresh); else render();
}

function viewTasks() {
  const out = [h("h2", t("tasks_title"))];
  if (!data.challenges.length) out.push(h("div.card.muted", t("tasks_none")));
  for (const c of data.challenges) {
    const pct = c.target ? Math.min(100, Math.round(c.value / c.target * 100)) : 0;
    const unit = t("u_" + (c.metric === "revenue" ? "revenue" : c.metric === "streak" ? "streak" : "orders"));
    out.push(h("div.card",
      h("div.row", h("b", (c.done ? "✅ " : "") + c.title), h("span.badge", t("reward", { n: c.reward }))),
      h("div.bar", h("i", { style: "width:" + (c.done ? 100 : pct) + "%" })),
      h("div.muted", c.done ? t("done") : fmt(c.value) + " / " + fmt(c.target) + unit)));
  }
  if (data.challenges.length) out.push(h("div.muted", { style: "margin:0 4px" }, t("tasks_note")));

  const top = data.top;
  out.push(h("h2", "🏆 " + t("top_title")));
  const medals = { 1: "🥇", 2: "🥈", 3: "🥉" };
  out.push(h("div.card",
    h("div.muted", { style: "margin-bottom:6px" }, t("top_note", { p: top.min_pct })),
    top.rows.length
      ? h("div.top", top.rows.map((x, i) => h("div" + (x.me ? ".me" : ""),
          h("span.p", medals[i + 1] || String(i + 1)), h("span.n", x.name), h("span", fmt(x.n)))))
      : h("div.muted", t("top_empty")),
    h("div", { style: "margin-top:10px;font-weight:600" },
      top.place ? t("top_you", { place: top.place, n: top.n }) : t("top_you_none"))));
  return out;
}

function viewFriends() {
  const inv = data.invite;
  const shareUrl = "https://t.me/share/url?url=" + encodeURIComponent(inv.link) + "&text=" + encodeURIComponent(t("share_text"));
  const out = [
    h("div.card",
      h("b", "🤝 " + t("inv_title")),
      h("p", { style: "margin:8px 0" }, t("inv_text", inv)),
      h("div.link", inv.link),
      h("button", { onclick: () => tg.openTelegramLink(shareUrl) }, t("share")),
      h("button.ghost", { onclick: copyLink }, t("copy"))),
    h("h2", t("inv_list")),
  ];
  out.push(h("div.card", inv.list.length
    ? h("div.list", inv.list.map(x => h("div", h("span", x.name),
        h("span.muted", x.state === "done" ? t("inv_done") : x.state === "expired" ? t("inv_exp")
          : t("inv_prog", { done: x.done, need: x.need })))))
    : h("div.muted", t("inv_none"))));
  return out;
}

async function copyLink() {
  try { await navigator.clipboard.writeText(data.invite.link); haptic("success"); alertMsg(t("copied")); }
  catch (e) { alertMsg(data.invite.link); }
}

function viewMore() {
  const seg = (items, cur, fn) => h("div.seg", items.map(([v, label]) =>
    h("button" + (v === cur ? "" : ".off"), { style: "width:auto", onclick: () => v !== cur && fn(v) }, label)));
  const ta = h("textarea", { placeholder: t("support_ph"), maxlength: "1000" });
  return [
    h("h2", t("lang")),
    h("div.card", seg([["ru", "🇷🇺 Русский"], ["uz", "🇺🇿 O'zbekcha"]], lang, v => setPref({ lang: v }))),
    h("div.card", h("div", { style: "margin-bottom:8px" }, t("notify")),
      seg([[true, t("on")], [false, t("off")]], data.me.notify, v => setPref({ notify: v }))),
    h("h2", t("rules")),
    h("div.card", { style: "white-space:pre-line" }, data.rules || data.rule || "—"),
    h("h2", t("support")),
    h("div.card", ta, h("button", { onclick: () => sendSupport(ta) }, t("send"))),
    h("button.danger", { onclick: deleteMe }, t("delete")),
  ];
}

async function setPref(p) {
  if (busy) return;
  busy = true;
  loading();
  const r = await call("set", p);
  busy = false;
  if (!r.ok && lostProfile(r)) return;
  if (!r.ok) { await alertMsg(errText(r.error)); return render(); }
  apply(r);
}

async function sendSupport(ta) {
  const text = ta.value.trim();
  if (!text || busy) return;
  busy = true;
  const r = await call("support", { text });
  busy = false;
  if (!r.ok && lostProfile(r)) return;
  if (!r.ok) return alertMsg(errText(r.error));
  ta.value = "";
  haptic("success");
  alertMsg(t("support_sent"));
}

async function deleteMe() {
  if (busy || !(await confirmMsg(t("delete_confirm")))) return;
  busy = true;
  const r = await call("delete");
  busy = false;
  if (!r.ok && lostProfile(r)) return;
  if (!r.ok) return alertMsg(errText(r.error));
  await alertMsg(t("deleted"));
  tg.close();
}

if (tg) { tg.ready(); tg.expand(); }
start();
</script>
